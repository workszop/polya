<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polya Framework · edulab</title>
    <style>
        /* ============================================================
           edulab - Colors & Type foundation (edustyl tokens)
           ============================================================ */
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap');

        :root {
            /* ---- Brand fonts ---- */
            --font-display: 'Outfit', 'IBM Plex Sans', system-ui, sans-serif;
            --font-sans:    'IBM Plex Sans', system-ui, -apple-system, sans-serif;
            --font-mono:    'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;

            /* Paper - page background is white; the sand steps are wells/alternating sections */
            --paper:    #FFFFFF;
            --paper-2:  #FBF7E6;
            --paper-3:  #F5EDCB;
            --surface:  #FFFFFF;

            /* Ink - warm near-black text & lines */
            --ink:      #1C1917;
            --ink-2:    #57534E;
            --ink-3:    #948C82;
            --line:     #EDE7D2;
            --line-2:   #DDD4B6;

            /* Yellow primary · Blue + Green secondary · Red danger (-soft = solid fill, -ink = text on it) */
            --yellow:      #FFD500;  --yellow-600: #F0C800;  --yellow-soft: #FFD500;  --yellow-ink: #1C1917;
            --blue:        #1E8FC2;  --blue-600:   #177AA8;  --blue-soft:   #1E8FC2;  --blue-ink:   #FFFFFF;
            --green:       #00A651;  --green-600:  #009444;  --green-soft:  #00A651;  --green-ink:  #FFFFFF;
            --red:         #E5322D;  --red-600:    #C92823;  --red-soft:    #E5322D;  --red-ink:    #FFFFFF;

            /* Legacy role aliases */
            --marigold: var(--yellow); --marigold-600: var(--yellow-600); --marigold-soft: var(--yellow-soft); --marigold-ink: var(--yellow-ink);
            --teal:     var(--blue);   --teal-600:     var(--blue-600);   --teal-soft:     var(--blue-soft);   --teal-ink:     var(--blue-ink);
            --sky:      var(--green);                                     --sky-soft:      var(--green-soft);  --sky-ink:      var(--green-ink);
            --coral:    var(--red);    --coral-600:    var(--red-600);    --coral-soft:    var(--red-soft);    --coral-ink:    var(--red-ink);

            /* Play palette */
            --play-sun: #FFD500; --play-grass: #00A651; --play-berry: #C6478B;
            --play-grape: #7A5AC2; --play-sky: #1E8FC2; --play-coral: #E5322D;

            /* Semantic */
            --success: #00A651;  --success-soft: #00A651;  --success-ink: #FFFFFF;
            --warning: #FFD500;  --warning-soft: #FFD500;  --warning-ink: #1C1917;
            --danger:  #E5322D;  --danger-soft:  #E5322D;  --danger-ink:  #FFFFFF;
            --info:    #1E8FC2;  --info-soft:    #1E8FC2;  --info-ink:    #FFFFFF;

            /* Functional aliases */
            --bg: var(--paper); --fg: var(--ink); --fg-muted: var(--ink-2);
            --primary: var(--yellow);
            --on-primary: #1C1917;
            --focus-ring: 0 0 0 3px color-mix(in srgb, var(--yellow) 45%, transparent);

            /* Spacing (4pt base) */
            --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
            --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
            --sp-12: 48px; --sp-16: 64px; --sp-20: 80px; --sp-24: 96px;

            /* Radii */
            --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;

            /* Elevation - warm, low, soft */
            --shadow-sm: 0 1px 2px rgba(33,30,26,.06), 0 1px 1px rgba(33,30,26,.04);
            --shadow-md: 0 4px 16px rgba(33,30,26,.08), 0 1px 3px rgba(33,30,26,.05);
            --shadow-lg: 0 16px 40px rgba(33,30,26,.12), 0 3px 8px rgba(33,30,26,.06);
            --shadow-primary:  0 8px 22px color-mix(in srgb, var(--yellow) 30%, transparent);
            --shadow-marigold: var(--shadow-primary);

            /* Type scale */
            --display-font: clamp(48px, 6vw, 72px);
            --h1: 44px; --h2: 33px; --h3: 25px; --h4: 19px;
            --body-lg: 18px; --body: 16px; --body-sm: 14px;
            --caption: 13px; --overline: 12px;
        }

        /* ─── Semantic type (element defaults sit in :where() so any class wins) ─── */
        :where(.edu) h1, .edu-h1 { font-family: var(--font-display); font-weight: 700; font-size: var(--h1); line-height: 1.06; letter-spacing: -.02em; color: var(--ink); }
        :where(.edu) h2, .edu-h2 { font-family: var(--font-display); font-weight: 600; font-size: var(--h2); line-height: 1.12; letter-spacing: -.015em; color: var(--ink); }
        :where(.edu) h3, .edu-h3 { font-family: var(--font-display); font-weight: 600; font-size: var(--h3); line-height: 1.2; letter-spacing: -.01em; color: var(--ink); }
        :where(.edu) h4, .edu-h4 { font-family: var(--font-sans); font-weight: 700; font-size: var(--h4); line-height: 1.3; color: var(--ink); }
        :where(.edu) p, .edu-p { font-family: var(--font-sans); font-weight: 400; font-size: var(--body); line-height: 1.6; color: var(--ink-2); }
        .edu-body-lg { font-family: var(--font-sans); font-size: var(--body-lg); line-height: 1.6; color: var(--ink-2); }
        .edu-small { font-family: var(--font-sans); font-size: var(--body-sm); line-height: 1.5; color: var(--ink-2); }
        .edu-overline {
            font-family: var(--font-mono); font-weight: 500; font-size: var(--overline);
            letter-spacing: .14em; text-transform: uppercase; color: var(--ink);
        }
        .edu-block, .edu-block h1, .edu-block h2, .edu-block h3, .edu-block h4, .edu-block p,
        .edu-block li, .edu-block small { color: inherit; }

        /* ─── Base ─── */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body.edu {
            background: var(--paper);
            color: var(--ink);
            font-family: var(--font-sans);
            font-size: var(--body);
            line-height: 1.6;
        }
        button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
        button:focus-visible, textarea:focus-visible, a:focus-visible { outline: none; box-shadow: var(--focus-ring); }
        button:disabled { opacity: .4; cursor: not-allowed; }

        /* ─── Branded top menu (shared edulab chrome) ─── */
        .edu-header {
            position: sticky; top: 0; z-index: 50; width: 100%;
            background: color-mix(in srgb, var(--paper) 85%, transparent);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line);
        }
        .edu-header-inner {
            max-width: 1100px; margin: 0 auto;
            padding: 8px 30px; display: flex; align-items: center; gap: 12px;
        }
        .edu-logo { width: 64px; height: 64px; display: block; margin-right: -6px; }
        .edu-wordmark { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; color: var(--ink); }

        /* ─── Language switch (sand track, full pills) ─── */
        .edu-seg { display: inline-flex; gap: 2px; padding: 3px; margin-left: auto; background: var(--paper-2); border-radius: var(--r-pill); }
        .edu-seg button {
            padding: 7px 14px; border-radius: var(--r-pill);
            font-family: var(--font-sans); font-weight: 600; font-size: var(--body-sm); color: var(--ink-2);
            transition: background .15s ease, color .15s ease;
        }
        .edu-seg button:hover { color: var(--ink); }
        .edu-seg button.active { background: var(--yellow); color: var(--yellow-ink); }

        /* ─── Layout shell ─── */
        .shell { max-width: 1100px; margin: 0 auto; padding: 34px 30px 70px; }
        .shell > * + * { margin-top: 28px; }

        /* ─── Page header (solid title → full-width lead) ─── */
        .page-header { text-align: center; padding: 12px 0 18px; }
        .app-title {
            font-family: var(--font-display); font-weight: 800;
            font-size: clamp(2rem, 4.5vw, 2.85rem); letter-spacing: -.025em;
            line-height: 1.05; color: var(--ink);
        }
        .edu-lead { font-size: 1.0625rem; color: var(--ink-2); margin: 14px 0 0; }

        /* ─── Cards ─── */
        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--r-xl);
            box-shadow: var(--shadow-md);
            padding: 30px 34px;
        }
        .card-title {
            font-family: var(--font-display); font-weight: 700; font-size: var(--h3);
            line-height: 1.2; letter-spacing: -.015em; color: var(--ink);
            margin-bottom: 18px;
        }

        .problem-well {
            background: var(--yellow-soft);
            color: var(--yellow-ink);
            border-radius: var(--r-lg);
            padding: 22px 26px;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: var(--h4);
            line-height: 1.45;
            text-align: center;
        }
        .hint-note {
            display: flex; align-items: flex-start; gap: 12px;
            margin-top: 16px; padding: 14px 18px;
            background: var(--blue-soft); color: var(--blue-ink);
            border-radius: var(--r-md);
        }
        .hint-note p { font-size: 14.5px; line-height: 1.55; }

        /* ─── Progress indicator ─── */
        #progressBar { margin-bottom: 22px; }
        .progress-row { display: flex; gap: 14px; }
        .progress-step { flex: 1; min-width: 0; display: flex; flex-direction: column; text-align: center; transition: opacity .15s ease; }
        .progress-step:hover { opacity: .8; }
        .step-label {
            font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em;
            text-transform: uppercase; color: var(--ink-3);
            margin-top: 10px; line-height: 1.35; flex: 1;
        }
        .progress-step.is-current .step-label { color: var(--ink); font-weight: 500; }
        .step-track {
            height: 5px; background: var(--paper-3); border-radius: var(--r-pill);
            margin-top: 10px; overflow: hidden;
        }
        .step-fill { height: 100%; border-radius: var(--r-pill); width: 0; background: var(--yellow); transition: width .3s ease; }
        .progress-step.is-done .step-fill, .progress-step.is-current .step-fill { width: 100%; }
        .progress-caption { display: none; font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em;
                            text-transform: uppercase; color: var(--ink); text-align: center; margin-top: 10px; }

        /* ─── Question panels ─── */
        .question-panel {
            margin-top: 18px; padding: 24px 26px;
            background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r-lg);
        }
        .question-panel > * + * { margin-top: 16px; }
        .question-title { display: flex; align-items: flex-start; gap: 12px; }
        .question-number {
            flex: none; width: 30px; height: 30px; border-radius: var(--r-pill);
            background: var(--yellow); color: var(--yellow-ink);
            font-family: var(--font-mono); font-weight: 500; font-size: var(--body-sm);
            display: inline-flex; align-items: center; justify-content: center;
        }
        .question-text { font-family: var(--font-display); font-weight: 600; font-size: var(--h4); line-height: 1.35; color: var(--ink); padding-top: 2px; }

        textarea.answer {
            width: 100%; min-height: 128px; resize: vertical;
            background: var(--surface); color: var(--ink);
            border: 1px solid var(--line-2); border-radius: var(--r-md);
            padding: 14px 16px; font-family: var(--font-sans); font-size: var(--body); line-height: 1.55;
            transition: border-color .15s ease;
        }
        textarea.answer::placeholder { color: var(--ink-3); }
        textarea.answer:focus { border-color: var(--ink-3); }

        .persona-card { background: var(--surface); border: 1px solid var(--line);
                        border-radius: var(--r-lg); padding: 18px 20px; margin-top: 12px; box-shadow: var(--shadow-sm); }
        .persona-name { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--ink); }
        .persona-field { margin-top: 8px; font-size: 14.5px; color: var(--ink-2); }
        .persona-field .edu-overline { display: block; margin-bottom: 2px; }

        .example-block { border-top: 1px dashed var(--line-2); padding-top: 16px; }
        .example-toggle {
            display: inline-flex; align-items: center; gap: 8px;
            font-family: var(--font-display); font-weight: 600; font-size: var(--body-sm);
            padding: 9px 16px; border-radius: var(--r-pill);
            background: var(--surface); color: var(--ink);
            border: 1px solid var(--line-2);
            transition: background .15s ease, color .15s ease;
        }
        .example-toggle:hover { background: var(--paper-3); }
        .example-toggle.is-open { background: var(--blue); color: var(--blue-ink); border-color: var(--blue); }
        .example-answer {
            margin-top: 14px; padding: 18px 20px;
            background: var(--blue-soft); color: var(--blue-ink);
            border-radius: var(--r-md);
        }
        .example-answer-text { white-space: pre-wrap; font-size: 15px; line-height: 1.6; }

        .question-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 4px; }

        /* ─── Investigate screen ─── */
        .fact-chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .fact-chip { font-family: var(--font-mono); font-size: var(--overline); padding: 6px 12px;
                     border-radius: var(--r-pill); background: var(--green-soft); color: var(--green-ink); }
        .inv-question { border: 1px solid var(--line); border-radius: var(--r-md);
                        padding: 12px 16px; margin-top: 10px; background: var(--surface);
                        transition: background .15s ease; }
        .inv-question:has(button:not(:disabled)):hover { background: var(--paper-2); }
        .inv-question button { font-family: var(--font-sans); font-weight: 600; color: var(--ink);
                               width: 100%; text-align: left; }
        .inv-question button:disabled { opacity: 1; color: var(--ink-3); }
        .inv-answer { margin-top: 10px; padding: 12px 14px; border-radius: var(--r-sm);
                      background: var(--paper-2); color: var(--ink-2); font-size: 15px; }
        .inv-answer.is-unknown { background: var(--red-soft); color: var(--red-ink); font-weight: 600; }

        /* Assumption ledger - dark data panel */
        .ledger-panel { position: sticky; top: 96px; background: var(--ink); color: var(--paper);
                        border-radius: var(--r-xl); padding: 22px 24px; }
        .ledger-panel h4 { font-family: var(--font-mono); font-weight: 500; font-size: 11px; letter-spacing: .14em;
                           text-transform: uppercase; color: color-mix(in srgb, var(--paper) 55%, transparent); margin-bottom: 6px; }
        .ledger-panel li { font-size: 15px; line-height: 1.5; list-style: none; padding: 10px 0;
                           border-top: 1px solid color-mix(in srgb, var(--paper) 14%, transparent); }
        .ledger-panel li::marker { content: none; }
        .ledger-panel li.is-empty { color: color-mix(in srgb, var(--paper) 55%, transparent); }
        .ledger-bullet { color: var(--yellow); font-weight: 700; margin-right: 6px; }
        .inv-layout { display: grid; grid-template-columns: 1fr 280px; gap: 24px; align-items: start; }

        /* ─── Buttons ─── */
        .edu-btn {
            display: inline-flex; align-items: center; gap: 8px;
            font-family: var(--font-display); font-weight: 600; font-size: var(--body);
            background: var(--yellow); color: var(--on-primary);
            border-radius: var(--r-pill); padding: 12px 22px;
            box-shadow: var(--shadow-primary);
            transition: background .15s ease, transform .12s cubic-bezier(.32,.72,.32,1);
        }
        .edu-btn:hover:not(:disabled) { background: var(--yellow-600); }
        .edu-btn:active:not(:disabled) { transform: scale(.96); }

        .edu-btn-ghost {
            display: inline-flex; align-items: center; gap: 8px;
            font-family: var(--font-display); font-weight: 600; font-size: var(--body);
            background: var(--surface); color: var(--ink);
            border: 1px solid var(--line-2);
            border-radius: var(--r-pill); padding: 11px 21px;
            transition: background .15s ease, color .15s ease;
        }
        .edu-btn-ghost:hover:not(:disabled) { background: var(--paper-2); }

        .edu-btn-sm { padding: 8px 16px; font-size: var(--body-sm); }
        .edu-btn-ghost.is-danger { color: var(--red); }
        .edu-btn-ghost.is-danger:hover:not(:disabled) { background: var(--red); color: var(--red-ink); border-color: var(--red); }

        /* ─── Summary ─── */
        .summary-list { margin-top: 6px; }
        .summary-list li { list-style: none; }

        .hidden { display: none; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
                   overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

        .question-enter { animation: question-enter 180ms ease-out; }
        @keyframes question-enter {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ─── Responsive ─── */
        @media (max-width: 768px) {
            .edu-header-inner { padding: 6px 16px; }
            .edu-logo { width: 48px; height: 48px; }
            .shell { padding: 28px 16px 56px; }
            .card { padding: 22px 20px; border-radius: var(--r-lg); }
            .progress-row { gap: 8px; }
            .step-label { display: none; }
            .progress-caption { display: block; }
            .problem-well { font-size: 17px; padding: 18px 20px; }
            .inv-layout { grid-template-columns: 1fr; }
            .ledger-panel { position: static; }
        }

        @media print {
            .edu-header, .page-header, #progressBar, .question-nav { display: none; }
            body.edu { background: var(--surface); }
            .card { box-shadow: none; border: none; }
        }
    </style>
</head>

    <main class="shell">
        <header class="page-header">
            <h1 class="app-title">Przygoda z rozwiązywaniem problemów</h1>
            <p class="edu-lead">Przejdź przez cztery kroki metody George'a Pólyi: zrozum problem, opracuj plan, zrealizuj go i spójrz wstecz. Odpowiadaj na pytania pomocnicze, a na końcu zobaczysz podsumowanie swojej pracy.</p>
        </header>

        <div id="liveRegion" class="sr-only" aria-live="polite"></div>
        <div id="progressBar"></div>
        <div id="screenRoot"></div>
    </main>

    <script>
        // ─── Self-test harness ───
        const TESTS = [];
        let TESTING = false;
        function st(name, fn) { TESTS.push([name, fn]); }
        function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }
        function runSelfTests() {
            const results = TESTS.map(([name, fn]) => {
                STATE = freshState();
                TESTING = true;   // a failing test must not leak TESTING=false into the next one
                try { fn(); return { name, ok: true, err: '' }; }
                catch (e) { return { name, ok: false, err: String(e) }; }
            });
            document.body.innerHTML = '<ol id="selftest">' + results.map(r =>
                `<li data-st="${r.ok ? 'PASS' : 'FAIL'}">${r.ok ? 'PASS' : 'FAIL'}: ${escapeHtml(r.name)}${r.err ? ' – ' + escapeHtml(r.err) : ''}</li>`
            ).join('') + '</ol>';
        }

        st('t() returns pl string, falls back to key', () => {
            STATE.lang = 'pl';
            assert(t('nav.next') === 'Następny', 'pl lookup');
            STATE.lang = 'en';
            assert(t('nav.next') === 'Next', 'en lookup');
            assert(t('no.such.key') === 'no.such.key', 'key fallback');
        });
        st('initial screen is warmup', () => {
            assert(STATE.screen === 'warmup', 'got ' + STATE.screen);
        });
        st('go() follows FLOW and blocks guarded screens', () => {
            go('interstitial');
            assert(STATE.screen === 'interstitial', 'interstitial');
            go('execute');   // guard: needs ledger entry
            assert(STATE.screen !== 'execute', 'execute must be blocked without ledger entry');
            STATE.ledger.push({ id: 'a1', text: 'testowe założenie' });
            go('execute');
            assert(STATE.screen === 'execute', 'execute allowed with ledger entry');
        });
        st('investigate exit is blocked after crucial question until assumption logged', () => {
            STATE.screen = 'investigate';
            STATE.investigation.asked.push('q-crucial');
            STATE.investigation.crucialAsked = true;
            go('checkpoint');
            assert(STATE.screen === 'investigate', 'blocked');

        };

        RENDER.interstitial = () => {
            screenRoot.innerHTML = `
                <section class="card" style="text-align:center">
                    <h2 class="edu-h2">${t('interstitial.title')}</h2>
                    <p class="edu-body-lg" style="margin:14px auto 24px">${t('interstitial.body')}</p>
                    <button type="button" class="edu-btn" data-action="start-flagship">${t('interstitial.cta')}</button>
                </section>`;
            screenRoot.querySelector('[data-action="start-flagship"]').addEventListener('click', () => go('investigate'));
        };

        function budgetLeft() { return FLAGSHIP.budget - STATE.investigation.asked.length; }
        function askQuestion(id) {
            if (budgetLeft() <= 0) return;
            if (STATE.investigation.asked.includes(id)) return;
            const q = FLAGSHIP.infoMenu.find(item => item.id === id);
            if (!q) return;
            STATE.investigation.asked.push(id);
            if (q.kind === 'crucial') STATE.investigation.crucialAsked = true;
            persist();
            if (!TESTING) { renderAll(); announce(q.answer || q.unknownReply); }
        }
        function addAssumption(text) {
            const clean = text.trim();
            if (!clean) return;
            STATE.ledger.push({ id: 'a' + (STATE.ledger.length + 1), text: clean });
            persist();
            if (!TESTING) renderAll();
        }
        function renderLedgerPanel() {
            const items = STATE.ledger.length
                ? STATE.ledger.map(a => `<li><span class="ledger-bullet" aria-hidden="true">•</span>${escapeHtml(a.text)}</li>`).join('')
                : `<li class="is-empty">${t('ledger.empty')}</li>`;
            return `<aside class="ledger-panel" aria-label="${t('ledger.title')}">
                <h4>${t('ledger.title')}</h4><ul>${items}</ul></aside>`;
        }

        RENDER.investigate = () => {
            const needsAssumption = STATE.investigation.crucialAsked && STATE.ledger.length === 0;
            screenRoot.innerHTML = `
                <section class="card">
                    <h2 class="card-title">${t('inv.eyebrow')}</h2>
                    <div class="problem-well">${FLAGSHIP.brief}</div>
                    <div class="inv-layout" style="margin-top:18px">
                        <div>
                            <p class="edu-overline" style="margin-bottom:8px">${t('inv.facts')}</p>
                            <div class="fact-chips">${FLAGSHIP.knownFacts.map(f => `<span class="fact-chip">${f}</span>`).join('')}</div>
                            <p class="edu-overline" style="margin:20px 0 4px">${tn('inv.menu', FLAGSHIP.budget)} · ${tn('inv.budgetLeft', budgetLeft())}</p>
                            ${FLAGSHIP.infoMenu.map(q => {
                                const asked = STATE.investigation.asked.includes(q.id);
                                const reply = asked ? (q.answer
                                    ? `<div class="inv-answer">${q.answer}</div>`
                                    : `<div class="inv-answer is-unknown">${q.unknownReply}</div>`) : '';
                                return `<div class="inv-question">
                                    <button type="button" data-ask="${q.id}" ${asked || budgetLeft() <= 0 ? 'disabled' : ''}>${q.question}</button>
                                    ${reply}</div>`;
                            }).join('')}
                            ${needsAssumption ? `
                                <div class="question-panel question-enter" style="margin-top:16px">
                                    <p class="edu-p"><strong>${t('inv.assumptionPrompt')}</strong></p>
                                    <textarea class="answer" id="assumption-input" style="min-height:64px"></textarea>
                                    <button type="button" class="edu-btn edu-btn-sm" data-action="add-assumption">${t('ledger.add')}</button>
                                </div>` : ''}
                            <div class="question-nav" style="margin-top:20px">
                                <span></span>
                                <button type="button" class="edu-btn" data-action="to-checkpoint" ${canLeaveInvestigate() ? '' : 'disabled'}>${t('inv.next')} →</button>
                            </div>
                        </div>
                        ${renderLedgerPanel()}
                    </div>
                </section>`;
            screenRoot.querySelectorAll('[data-ask]').forEach(b =>
                b.addEventListener('click', () => askQuestion(b.dataset.ask)));
            const addBtn = screenRoot.querySelector('[data-action="add-assumption"]');
            if (addBtn) addBtn.addEventListener('click', () =>
                addAssumption(document.getElementById('assumption-input').value));
            screenRoot.querySelector('[data-action="to-checkpoint"]').addEventListener('click', () => go('checkpoint'));
        };

        RENDER.checkpoint = () => {
            const gapUnnoticed = STATE.ledger.length === 0;
            screenRoot.innerHTML = `
                <section class="card">
                    <h2 class="card-title">${t('chk.title')}</h2>
                    <p class="question-text">${t('chk.question')}</p>
                    ${gapUnnoticed ? `
                        <div class="hint-note edu-block" style="margin-top:16px"><p><strong>${FLAGSHIP.gapPrompt}</strong></p></div>
                        <div class="question-panel question-enter" style="margin-top:14px">
                            <textarea class="answer" id="assumption-input" style="min-height:64px"></textarea>
                            <button type="button" class="edu-btn edu-btn-sm" data-action="add-assumption">${t('ledger.add')}</button>
                        </div>` : `
                        <p class="edu-p" style="margin-top:12px">${t('chk.ok')}</p>`}
                    <div class="question-nav" style="margin-top:20px">
                        <button type="button" class="edu-btn-ghost edu-btn-sm" data-action="back">← ${t('nav.prev')}</button>
                        <button type="button" class="edu-btn" data-action="to-plan" ${STATE.ledger.length ? '' : 'disabled'}>${t('chk.continue')} →</button>
                    </div>
                </section>`;
            const addBtn = screenRoot.querySelector('[data-action="add-assumption"]');
            if (addBtn) addBtn.addEventListener('click', () =>
                addAssumption(document.getElementById('assumption-input').value));
            screenRoot.querySelector('[data-action="back"]').addEventListener('click', () => go('investigate'));
            screenRoot.querySelector('[data-action="to-plan"]').addEventListener('click', () => go('plan'));
        };

        RENDER.plan = () => {
            screenRoot.innerHTML = `
                <section class="card">
                    <h2 class="card-title">${t('plan.eyebrow')}</h2>
                    <div class="inv-layout">
                        <div>
                            ${FLAGSHIP.planPrompts.map((p, i) => `
                                <div class="question-panel" style="margin-top:${i ? '14px' : '0'}">
                                    <div class="question-title">
                                        <span class="question-number">${i + 1}</span>
                                        <span class="question-text">${p.text}</span>
                                    </div>
                                    <textarea class="answer" data-plan="${p.id}">${escapeHtml(STATE.plan.responses[p.id] || '')}</textarea>
                                </div>`).join('')}
                            <div class="question-nav" style="margin-top:20px">
                                <button type="button" class="edu-btn-ghost edu-btn-sm" data-action="back">← ${t('nav.prev')}</button>
                                <button type="button" class="edu-btn" data-action="to-execute">${t('plan.next')} →</button>
                            </div>
                        </div>
                        ${renderLedgerPanel()}
                    </div>
                </section>`;
            screenRoot.querySelectorAll('[data-plan]').forEach(area =>
                area.addEventListener('input', e => { STATE.plan.responses[area.dataset.plan] = e.target.value; persist(); }));
            screenRoot.querySelector('[data-action="back"]').addEventListener('click', () => go('checkpoint'));
            screenRoot.querySelector('[data-action="to-execute"]').addEventListener('click', () => go('execute'));
        };

        RENDER.execute = () => {
            const assumptions = STATE.ledger.map(a => escapeHtml(a.text)).join('; ');
            screenRoot.innerHTML = `
                <section class="card">
                    <h2 class="card-title">${t('exec.eyebrow')}</h2>
                    <div class="inv-layout">
                        <div>
                            <div class="question-panel">
                                <span class="question-text">${t('exec.work')}</span>
                                <textarea class="answer" id="exec-work" style="min-height:170px">${escapeHtml(STATE.execute.work)}</textarea>
                            </div>
                            <div class="question-panel" style="margin-top:14px">
                                <span class="question-text">${t('exec.answerFrame')}</span>
                                <p class="edu-small" style="font-style:italic">${assumptions}</p>
                                <span class="question-text">${t('exec.answerLabel')}</span>
                                <textarea class="answer" id="exec-answer" style="min-height:64px">${escapeHtml(STATE.execute.answer)}</textarea>
                            </div>
                            <div class="question-nav" style="margin-top:20px">
                                <button type="button" class="edu-btn-ghost edu-btn-sm" data-action="back">← ${t('nav.prev')}</button>
                                <button type="button" class="edu-btn" data-action="to-lookback" ${STATE.execute.answer.trim() ? '' : 'disabled'}>${t('exec.next')} →</button>
                            </div>
                        </div>
                        ${renderLedgerPanel()}
                    </div>
                </section>`;
            screenRoot.querySelector('#exec-work').addEventListener('input', e => { STATE.execute.work = e.target.value; persist(); });
            screenRoot.querySelector('#exec-answer').addEventListener('input', e => {
                STATE.execute.answer = e.target.value; persist();
                screenRoot.querySelector('[data-action="to-lookback"]').disabled = !e.target.value.trim();
            });
            screenRoot.querySelector('[data-action="back"]').addEventListener('click', () => go('plan'));
            screenRoot.querySelector('[data-action="to-lookback"]').addEventListener('click', () => go('lookback'));
        };

        RENDER.lookback = () => {
            const lb = STATE.lookback;
            screenRoot.innerHTML = `
                <section class="card">
                    <h2 class="card-title">${t('look.eyebrow')}</h2>
                    <h3 class="edu-h4">${t('look.sensTitle')}</h3>
                    ${FLAGSHIP.sensitivity.map((s, i) => `
                        <div class="question-panel" style="margin-top:14px">
                            <div class="question-title">
                                <span class="question-number">${i + 1}</span>
                                <span class="question-text">${s.text}</span>
                            </div>
                            <textarea class="answer" data-sens="${s.id}" style="min-height:80px">${escapeHtml(lb.reactions[s.id] || '')}</textarea>
                        </div>`).join('')}
                    ${lb.galleryRevealed ? `
                        <h3 class="edu-h4" style="margin-top:28px">${t('look.galleryTitle')}</h3>
                        <p class="edu-p" style="margin-top:6px">${t('look.galleryNote')}</p>
                        ${FLAGSHIP.gallery.map(p => `
                            <div class="persona-card question-enter">
                                <div class="persona-name">${p.name}</div>
                                <div class="persona-field"><span class="edu-overline">${t('look.personaAssumption')}</span>${escapeHtml(p.assumption)}</div>
                                <div class="persona-field">${escapeHtml(p.solution)}</div>
                                <div class="persona-field"><span class="edu-overline">${t('look.personaResult')}</span>${escapeHtml(p.result)}</div>
                            </div>`).join('')}
                        <div class="question-panel" style="margin-top:22px">
                            <span class="question-text">${t('look.reflection')}</span>
                            <textarea class="answer" id="reflection-input" style="min-height:80px">${escapeHtml(lb.reflection)}</textarea>
                        </div>
                        <div class="question-nav" style="margin-top:20px">
                            <button type="button" class="edu-btn-ghost edu-btn-sm" data-action="back">← ${t('nav.prev')}</button>
                            <button type="button" class="edu-btn" data-action="to-summary">${t('look.next')} →</button>
                        </div>` : `
                        <div class="question-nav" style="margin-top:20px">
                            <button type="button" class="edu-btn-ghost edu-btn-sm" data-action="back">← ${t('nav.prev')}</button>
                            <button type="button" class="edu-btn" data-action="reveal-gallery">${t('look.galleryCta')}</button>
                        </div>`}
                </section>`;
            screenRoot.querySelectorAll('[data-sens]').forEach(area =>
                area.addEventListener('input', e => { STATE.lookback.reactions[area.dataset.sens] = e.target.value; persist(); }));
            const reveal = screenRoot.querySelector('[data-action="reveal-gallery"]');
            if (reveal) reveal.addEventListener('click', () => { STATE.lookback.galleryRevealed = true; persist(); renderAll(); });
            const refl = screenRoot.querySelector('#reflection-input');
            if (refl) refl.addEventListener('input', e => { STATE.lookback.reflection = e.target.value; persist(); });
            screenRoot.querySelector('[data-action="back"]').addEventListener('click', () => go('execute'));
            const toSummary = screenRoot.querySelector('[data-action="to-summary"]');
            if (toSummary) toSummary.addEventListener('click', () => go('summary'));
        };

        RENDER.summary = () => {
            screenRoot.innerHTML = `
                <section class="card" id="printArea">
                    <h2 class="card-title">${t('sum.eyebrow')}</h2>
                    <div class="problem-well">${FLAGSHIP.brief}</div>
                    <h4 class="edu-h4" style="margin-top:18px">${t('sum.assumptions')}</h4>
                    <ul class="summary-list">${STATE.ledger.map(a => `<li class="edu-p">• ${escapeHtml(a.text)}</li>`).join('')}</ul>
                    <h4 class="edu-h4" style="margin-top:18px">${t('sum.answer')}</h4>
                    <p class="edu-p" style="white-space:pre-wrap">${escapeHtml(STATE.execute.answer)}</p>
                    <h4 class="edu-h4" style="margin-top:18px">${t('sum.reflection')}</h4>
                    <p class="edu-p" style="white-space:pre-wrap">${escapeHtml(STATE.lookback.reflection)}</p>
                    <div class="question-nav" style="margin-top:24px">
                        <button type="button" class="edu-btn-ghost is-danger edu-btn-sm" data-action="reset">${t('nav.reset')}</button>
                        <button type="button" class="edu-btn" data-action="print">${t('sum.print')}</button>
                    </div>
                </section>`;
            screenRoot.querySelector('[data-action="reset"]').addEventListener('click', handleReset);
            screenRoot.querySelector('[data-action="print"]').addEventListener('click', () => window.print());
        };

        function handleReset() {
            STATE = freshState();
            try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
            if (!TESTING) { renderAll(); announce('reset'); }
        }

        function renderAll() { renderProgress(); RENDER[STATE.screen](); }

        // ─── Listeners ───
        document.addEventListener('keydown', e => {
            if (TESTING || e.target.matches('textarea, input')) return;
            const order = FLOW.indexOf(STATE.screen);
            if (e.key === 'ArrowRight' && order < FLOW.length - 1) go(FLOW[order + 1]);
            if (e.key === 'ArrowLeft' && order > 0) go(FLOW[order - 1]);
        });
        langToggle.addEventListener('click', e => {
            const btn = e.target.closest('[data-lang]');
            if (!btn || btn.dataset.lang === STATE.lang) return;
            STATE.lang = btn.dataset.lang;
            persist(); syncLangToggle(); renderAll();
        });

        // ─── Init ───
        document.addEventListener('DOMContentLoaded', () => {
            if (location.search.includes('selftest=1')) { TESTING = true; runSelfTests(); return; }
            restore();
            const jump = new URLSearchParams(location.search).get('screen');
            if (jump && FLOW.includes(jump)) STATE.screen = jump;
            syncLangToggle();
            renderAll();
        });
    </script>
</body>
</html>

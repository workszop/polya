<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polya Framework · edulab</title>
    <style>
        /* ============================================================
           edulab — Colors & Type foundation (design tokens)
           ============================================================ */
        @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

        :root {
            --font-display: 'Bricolage Grotesque', 'Hanken Grotesk', system-ui, sans-serif;
            --font-sans:    'Hanken Grotesk', system-ui, -apple-system, sans-serif;
            --font-mono:    'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace;

            --paper:    #FBF7F0;
            --paper-2:  #F4EDDF;
            --paper-3:  #ECE1CF;
            --surface:  #FFFFFF;

            --ink:      #211E1A;
            --ink-2:    #5B554D;
            --ink-3:    #938A7C;
            --line:     #E7DCCB;
            --line-2:   #D6C8B2;

            --marigold:      #E8920C;
            --marigold-600:  #CE800A;
            --marigold-soft: #FBE7C2;
            --marigold-ink:  #8A4F00;

            --teal:      #0E8C7F;
            --teal-600:  #0B7468;
            --teal-soft: #D2EBE6;
            --teal-ink:  #0A5A52;

            --coral:      #EF5B3F;
            --coral-600:  #D44A30;
            --coral-soft: #FBDDD4;
            --coral-ink:  #9A2E1B;

            --sky:      #2E78C9;
            --sky-soft: #D9E7F6;
            --sky-ink:  #1B4E88;

            --play-sun:    #F2A516;
            --play-grass:  #4FA45C;
            --play-berry:  #C6478B;
            --play-grape:  #7A5AC2;
            --play-sky:    #2E78C9;

            --success:      #2F8F5B;  --success-soft: #D7EEDD;  --success-ink: #1C6A3E;

            --focus-ring: 0 0 0 3px rgba(232,146,12,.38);

            --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;

            --shadow-sm: 0 1px 2px rgba(33,30,26,.06), 0 1px 1px rgba(33,30,26,.04);
            --shadow-md: 0 4px 16px rgba(33,30,26,.08), 0 1px 3px rgba(33,30,26,.05);
            --shadow-lg: 0 16px 40px rgba(33,30,26,.12), 0 3px 8px rgba(33,30,26,.06);
            --shadow-marigold: 0 8px 22px rgba(232,146,12,.28);
        }

        /* ─── Base ─── */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body.edu {
            background: var(--paper);
            color: var(--ink);
            font-family: var(--font-sans);
            font-size: 16px;
            line-height: 1.6;
        }
        button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
        button:focus-visible, textarea:focus-visible, a:focus-visible { outline: none; box-shadow: var(--focus-ring); }
        button:disabled { opacity: .4; cursor: not-allowed; }

        /* ─── Branded top menu (shared edulab chrome) ─── */
        .edu-header {
            position: sticky; top: 0; z-index: 50; width: 100%;
            background: rgba(251, 247, 240, 0.85);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line);
        }
        .edu-header-inner {
            max-width: 1100px; margin: 0 auto;
            padding: 15px 30px; display: flex; align-items: center; gap: 12px;
        }
        .edu-logo { width: 32px; height: 32px; display: block; }
        .edu-wordmark { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; color: var(--ink); }
        .edu-tag {
            font-family: var(--font-mono); font-weight: 500; font-size: 11px;
            letter-spacing: .14em; text-transform: uppercase; color: var(--teal-ink);
            background: var(--teal-soft); padding: 4px 9px; border-radius: var(--r-pill);
        }

        /* ─── Layout shell ─── */
        .shell { max-width: 920px; margin: 0 auto; padding: 44px 30px 70px; }
        .shell > * + * { margin-top: 28px; }

        /* ─── Page header scheme (eyebrow → title → lead) ─── */
        .page-header { text-align: center; padding: 12px 0 8px; }
        .edu-overline {
            font-family: var(--font-mono); font-weight: 500; font-size: 12px;
            letter-spacing: .14em; text-transform: uppercase; color: var(--marigold-ink);
        }
        .app-title {
            font-family: var(--font-display); font-weight: 800;
            font-size: clamp(2rem, 4.5vw, 2.85rem); letter-spacing: -.025em;
            line-height: 1.05; color: var(--ink);
            margin-top: 12px;
        }
        .edu-lead { font-size: 1.0625rem; color: var(--ink-2); max-width: 36rem; margin: 14px auto 0; }

        /* ─── Type scale ─── */
        .edu-h2 { font-family: var(--font-display); font-weight: 600; font-size: 33px; line-height: 1.12; letter-spacing: -.015em; color: var(--ink); }
        .edu-h3 { font-family: var(--font-display); font-weight: 600; font-size: 25px; line-height: 1.2; letter-spacing: -.01em; color: var(--ink); }
        .edu-h4 { font-family: var(--font-sans); font-weight: 700; font-size: 19px; line-height: 1.3; color: var(--ink); }
        .edu-p { font-family: var(--font-sans); font-weight: 400; font-size: 16px; line-height: 1.6; color: var(--ink-2); }
        .edu-small { font-family: var(--font-sans); font-size: 14px; line-height: 1.5; color: var(--ink-2); }

        /* ─── Cards ─── */
        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--r-xl);
            box-shadow: var(--shadow-md);
            padding: 30px 34px;
        }
        .card-eyebrow { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .card-eyebrow svg { color: var(--marigold); flex: none; }

        .problem-well {
            background: var(--marigold-soft);
            color: var(--marigold-ink);
            border-radius: var(--r-lg);
            padding: 22px 26px;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 19px;
            line-height: 1.45;
            text-align: center;
        }
        .hint-note {
            display: flex; align-items: flex-start; gap: 12px;
            margin-top: 16px; padding: 14px 18px;
            background: var(--sky-soft); color: var(--sky-ink);
            border-radius: var(--r-md);
            font-size: 14.5px; line-height: 1.55;
        }
        .hint-note svg { flex: none; margin-top: 2px; }

        /* ─── Progress indicator ─── */
        .progress-row { display: flex; gap: 14px; }
        .progress-step { flex: 1; text-align: center; transition: opacity .15s ease; }
        .progress-step:hover { opacity: .8; }
        .step-dot {
            width: 52px; height: 52px; border-radius: var(--r-pill);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto; color: #fff;
            box-shadow: var(--shadow-sm);
            transition: box-shadow .15s ease;
        }
        .step-dot svg { width: 46%; height: 46%; }
        .progress-step.is-current .step-dot { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
        .step-label {
            font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em;
            text-transform: uppercase; color: var(--ink-3);
            margin-top: 10px; line-height: 1.35;
        }
        .progress-step.is-current .step-label { color: var(--ink); font-weight: 500; }
        .step-track {
            height: 5px; background: var(--paper-3); border-radius: var(--r-pill);
            margin-top: 10px; overflow: hidden;
        }
        .step-fill { height: 100%; border-radius: var(--r-pill); width: 0; transition: width .3s ease; }
        .progress-step.is-done .step-fill, .progress-step.is-current .step-fill { width: 100%; }

        .tone-sky   { background: var(--play-sky); }
        .tone-sun   { background: var(--play-sun); }
        .tone-grass { background: var(--play-grass); }
        .tone-grape { background: var(--play-grape); }

        /* ─── Step content ─── */
        .step-head { display: flex; align-items: center; gap: 14px; margin-top: 26px; }
        .step-head .step-dot { margin: 0; width: 46px; height: 46px; }
        .step-head h3 {
            font-family: var(--font-display); font-weight: 600; font-size: 25px;
            letter-spacing: -.01em; color: var(--ink);
        }

        .step-progress {
            display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px;
            margin-top: 18px; padding: 14px 18px;
            background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-md);
        }
        .step-progress-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
        .step-progress-count { font-family: var(--font-display); font-weight: 600; font-size: 17px; color: var(--ink); margin-top: 2px; }
        .question-pips { display: flex; flex-wrap: wrap; gap: 8px; }
        .question-pip {
            width: 36px; height: 36px; border-radius: var(--r-pill);
            font-family: var(--font-mono); font-weight: 500; font-size: 14px;
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--surface); color: var(--ink-2);
            border: 1px solid var(--line-2);
            transition: background .15s ease, color .15s ease;
        }
        .question-pip:hover { border-color: var(--ink-3); }
        .question-pip.is-answered { background: var(--success-soft); color: var(--success-ink); border-color: transparent; }
        .question-pip.is-current { background: var(--marigold); color: #fff; border-color: transparent; }

        .question-panel {
            margin-top: 18px; padding: 24px 26px;
            background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg);
        }
        .question-panel > * + * { margin-top: 16px; }
        .question-title { display: flex; align-items: flex-start; gap: 12px; }
        .question-number {
            flex: none; width: 30px; height: 30px; border-radius: var(--r-pill);
            background: var(--marigold); color: #fff;
            font-family: var(--font-mono); font-size: 14px;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .question-text { font-family: var(--font-display); font-weight: 600; font-size: 19px; line-height: 1.35; color: var(--ink); padding-top: 2px; }

        textarea.answer {
            width: 100%; min-height: 128px; resize: vertical;
            background: var(--surface); color: var(--ink);
            border: 1px solid var(--line-2); border-radius: var(--r-md);
            padding: 14px 16px; font-family: var(--font-sans); font-size: 16px; line-height: 1.55;
            transition: border-color .15s ease;
        }
        textarea.answer::placeholder { color: var(--ink-3); }
        textarea.answer:focus { border-color: var(--marigold); }

        .example-block { border-top: 1px solid var(--line); padding-top: 16px; }
        .example-toggle {
            display: inline-flex; align-items: center; gap: 8px;
            font-family: var(--font-display); font-weight: 600; font-size: 14px;
            padding: 9px 16px; border-radius: var(--r-pill);
            background: var(--surface); color: var(--teal-ink);
            border: 1px solid var(--line-2);
            transition: background .15s ease;
        }
        .example-toggle:hover { background: var(--teal-soft); }
        .example-toggle.is-open { background: var(--teal-soft); border-color: transparent; }
        .example-answer {
            margin-top: 14px; padding: 18px 20px;
            background: var(--teal-soft); color: var(--teal-ink);
            border-radius: var(--r-md);
        }
        .example-answer-label {
            font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em;
            text-transform: uppercase; margin-bottom: 8px;
        }
        .example-answer-text { white-space: pre-wrap; font-size: 15px; line-height: 1.6; }

        .question-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 4px; }

        /* ─── Investigate screen ─── */
        .fact-chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .fact-chip { font-family: var(--font-mono); font-size: 12px; padding: 6px 12px;
                     border-radius: var(--r-pill); background: var(--sky-soft); color: var(--sky-ink); }
        .inv-question { border: 1px solid var(--line); border-radius: var(--r-md);
                        padding: 12px 16px; margin-top: 10px; background: var(--surface); }
        .inv-question button { font-family: var(--font-sans); font-weight: 600; color: var(--ink);
                               width: 100%; text-align: left; }
        .inv-question button:disabled { color: var(--ink-3); }
        .inv-answer { margin-top: 10px; padding: 12px 14px; border-radius: var(--r-sm);
                      background: var(--paper); color: var(--ink-2); font-size: 15px; }
        .inv-answer.is-unknown { background: var(--coral-soft); color: var(--coral-ink); font-weight: 600; }
        .ledger-panel { position: sticky; top: 76px; background: var(--marigold-soft); color: var(--marigold-ink);
                        border-radius: var(--r-lg); padding: 18px 20px; }
        .ledger-panel h4 { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em;
                           text-transform: uppercase; margin-bottom: 10px; }
        .ledger-panel li { font-size: 14.5px; line-height: 1.5; margin-top: 6px; list-style: none; }
        .inv-layout { display: grid; grid-template-columns: 1fr 260px; gap: 22px; align-items: start; }
        @media (max-width: 768px) { .inv-layout { grid-template-columns: 1fr; } .ledger-panel { position: static; } }

        /* ─── Buttons ─── */
        .edu-btn {
            display: inline-flex; align-items: center; gap: 8px;
            font-family: var(--font-display); font-weight: 600; font-size: 16px;
            background: var(--marigold); color: #fff;
            border-radius: var(--r-pill); padding: 12px 22px;
            box-shadow: var(--shadow-marigold);
            transition: background .15s ease, transform .12s cubic-bezier(.32,.72,.32,1);
        }
        .edu-btn:hover:not(:disabled) { background: var(--marigold-600); }
        .edu-btn:active:not(:disabled) { transform: scale(.96); }

        .edu-btn-ghost {
            display: inline-flex; align-items: center; gap: 8px;
            font-family: var(--font-display); font-weight: 600; font-size: 16px;
            background: var(--surface); color: var(--ink);
            border: 1px solid var(--line-2);
            border-radius: var(--r-pill); padding: 11px 21px;
            transition: background .15s ease;
        }
        .edu-btn-ghost:hover:not(:disabled) { background: var(--paper-2); }

        .edu-btn-sm { padding: 8px 16px; font-size: 14px; }
        .edu-btn-ghost.is-danger { color: var(--coral-ink); }
        .edu-btn-ghost.is-danger:hover:not(:disabled) { background: var(--coral-soft); border-color: transparent; }

        .main-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 26px; }

        /* ─── Summary ─── */
        .summary-head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .summary-check {
            flex: none; width: 40px; height: 40px; border-radius: var(--r-pill);
            background: var(--success-soft); color: var(--success-ink);
            display: flex; align-items: center; justify-content: center;
        }
        .summary-head h2 { font-family: var(--font-display); font-weight: 600; font-size: 25px; letter-spacing: -.01em; color: var(--ink); }
        .summary-step { padding: 20px 0; border-top: 1px solid var(--line); }
        .summary-step:first-of-type { border-top: none; padding-top: 0; }
        .summary-step-title { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: 19px; color: var(--ink); }
        .summary-step-title .step-dot { margin: 0; width: 34px; height: 34px; box-shadow: none; }
        .summary-answers { margin-top: 14px; padding-left: 16px; border-left: 3px solid var(--line-2); display: grid; gap: 12px; }
        .summary-answer { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 18px; }
        .summary-question { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
        .summary-response { white-space: pre-wrap; color: var(--ink-2); font-size: 15px; line-height: 1.6; }

        .hidden { display: none; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
                   overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

        .question-enter { animation: question-enter 180ms ease-out; }
        @keyframes question-enter {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ─── Responsive ─── */
        @media (max-width: 768px) {
            .shell { padding: 28px 18px 56px; }
            .card { padding: 22px 20px; border-radius: var(--r-lg); }
            .progress-row { gap: 8px; }
            .step-label { font-size: 10px; }
            .main-nav { flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>

    <main class="shell">
        <header class="page-header">
            <p class="edu-overline">Interaktywne narzędzie · Metoda Pólyi · 4 kroki</p>
            <h1 class="app-title">Przygoda z rozwiązywaniem problemów</h1>
            <p class="edu-lead">Przejdź przez cztery kroki metody George'a Pólyi: zrozum problem, opracuj plan, zrealizuj go i spójrz wstecz. Odpowiadaj na pytania pomocnicze, a na końcu zobaczysz podsumowanie swojej pracy.</p>
        </header>

        <div id="liveRegion" class="sr-only" aria-live="polite"></div>
        <div id="screenRoot"></div>
    </main>

    <script>
        // ─── Self-test harness ───
        const TESTS = [];
        let TESTING = false;
        function st(name, fn) { TESTS.push([name, fn]); }
        function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }
        function runSelfTests() {
            const results = TESTS.map(([name, fn]) => {
                STATE = freshState();
                TESTING = true;   // a failing test must not leak TESTING=false into the next one
                try { fn(); return { name, ok: true, err: '' }; }
                catch (e) { return { name, ok: false, err: String(e) }; }
            });
            document.body.innerHTML = '<ol id="selftest">' + results.map(r =>
                `<li data-st="${r.ok ? 'PASS' : 'FAIL'}">${r.ok ? 'PASS' : 'FAIL'}: ${escapeHtml(r.name)}${r.err ? ' – ' + escapeHtml(r.err) : ''}</li>`
            ).join('') + '</ol>';
        }

        st('t() returns pl string, falls back to key', () => {
            STATE.lang = 'pl';
            assert(t('nav.next') === 'Następny', 'pl lookup');
            STATE.lang = 'en';
            assert(t('nav.next') === 'Next', 'en lookup');
            assert(t('no.such.key') === 'no.such.key', 'key fallback');
        });
        st('initial screen is warmup', () => {
            assert(STATE.screen === 'warmup', 'got ' + STATE.screen);
        });
        st('go() follows FLOW and blocks guarded screens', () => {
            go('interstitial');
            assert(STATE.screen === 'interstitial', 'interstitial');
            go('execute');   // guard: needs ledger entry
            assert(STATE.screen !== 'execute', 'execute must be blocked without ledger entry');
            STATE.ledger.push({ id: 'a1', text: 'testowe założenie' });
            go('execute');
            assert(STATE.screen === 'execute', 'execute allowed with ledger entry');
        });
        st('investigate exit is blocked after crucial question until assumption logged', () => {
            STATE.screen = 'investigate';
            STATE.investigation.asked.push('q-crucial');
            STATE.investigation.crucialAsked = true;
            go('checkpoint');
            assert(STATE.screen === 'investigate', 'blocked');
            STATE.ledger.push({ id: 'a1', text: 'przyjdzie 20 osób' });
            go('checkpoint');
            assert(STATE.screen === 'checkpoint', 'allowed after assumption');
        });
        st('PROBLEMS has one exercise and one problem', () => {

                    <div class="question-nav" style="margin-top:20px">
                        <button type="button" class="edu-btn-ghost edu-btn-sm" data-action="back">← ${t('nav.prev')}</button>
                        <button type="button" class="edu-btn" data-action="to-plan" ${STATE.ledger.length ? '' : 'disabled'}>${t('chk.continue')} →</button>
                    </div>
                </section>`;
            const addBtn = screenRoot.querySelector('[data-action="add-assumption"]');
            if (addBtn) addBtn.addEventListener('click', () =>
                addAssumption(document.getElementById('assumption-input').value));
            screenRoot.querySelector('[data-action="back"]').addEventListener('click', () => go('investigate'));
            screenRoot.querySelector('[data-action="to-plan"]').addEventListener('click', () => go('plan'));
        };

        RENDER.plan = () => {
            screenRoot.innerHTML = `
                <section class="card">
                    <div class="card-eyebrow"><span class="edu-overline">${t('plan.eyebrow')}</span></div>
                    <div class="inv-layout">
                        <div>
                            ${FLAGSHIP.planPrompts.map((p, i) => `
                                <div class="question-panel" style="margin-top:${i ? '14px' : '0'}">
                                    <div class="question-title">
                                        <span class="question-number">${i + 1}</span>
                                        <span class="question-text">${p.text}</span>
                                    </div>
                                    <textarea class="answer" data-plan="${p.id}">${escapeHtml(STATE.plan.responses[p.id] || '')}</textarea>
                                </div>`).join('')}
                            <div class="question-nav" style="margin-top:20px">
                                <button type="button" class="edu-btn-ghost edu-btn-sm" data-action="back">← ${t('nav.prev')}</button>
                                <button type="button" class="edu-btn" data-action="to-execute">${t('plan.next')} →</button>
                            </div>
                        </div>
                        ${renderLedgerPanel()}
                    </div>
                </section>`;
            screenRoot.querySelectorAll('[data-plan]').forEach(area =>
                area.addEventListener('input', e => { STATE.plan.responses[area.dataset.plan] = e.target.value; persist(); }));
            screenRoot.querySelector('[data-action="back"]').addEventListener('click', () => go('checkpoint'));
            screenRoot.querySelector('[data-action="to-execute"]').addEventListener('click', () => go('execute'));
        };

        RENDER.execute = () => {
            const assumptions = STATE.ledger.map(a => escapeHtml(a.text)).join('; ');
            screenRoot.innerHTML = `
                <section class="card">
                    <div class="card-eyebrow"><span class="edu-overline">${t('exec.eyebrow')}</span></div>
                    <div class="inv-layout">
                        <div>
                            <div class="question-panel">
                                <span class="question-text">${t('exec.work')}</span>
                                <textarea class="answer" id="exec-work" style="min-height:170px">${escapeHtml(STATE.execute.work)}</textarea>
                            </div>
                            <div class="question-panel" style="margin-top:14px">
                                <span class="question-text">${t('exec.answerFrame')}</span>
                                <p class="edu-small" style="font-style:italic">${assumptions}</p>
                                <span class="question-text">${t('exec.answerLabel')}</span>
                                <textarea class="answer" id="exec-answer" style="min-height:64px">${escapeHtml(STATE.execute.answer)}</textarea>
                            </div>
                            <div class="question-nav" style="margin-top:20px">
                                <button type="button" class="edu-btn-ghost edu-btn-sm" data-action="back">← ${t('nav.prev')}</button>
                                <button type="button" class="edu-btn" data-action="to-lookback" ${STATE.execute.answer.trim() ? '' : 'disabled'}>${t('exec.next')} →</button>
                            </div>
                        </div>
                        ${renderLedgerPanel()}
                    </div>
                </section>`;
            screenRoot.querySelector('#exec-work').addEventListener('input', e => { STATE.execute.work = e.target.value; persist(); });
            screenRoot.querySelector('#exec-answer').addEventListener('input', e => {
                STATE.execute.answer = e.target.value; persist();
                screenRoot.querySelector('[data-action="to-lookback"]').disabled = !e.target.value.trim();
            });
            screenRoot.querySelector('[data-action="back"]').addEventListener('click', () => go('plan'));
            screenRoot.querySelector('[data-action="to-lookback"]').addEventListener('click', () => go('lookback'));
        };

        function renderAll() { RENDER[STATE.screen](); }

        // ─── Init ───
        document.addEventListener('DOMContentLoaded', () => {
            if (location.search.includes('selftest=1')) { TESTING = true; runSelfTests(); return; }
            restore();
            const jump = new URLSearchParams(location.search).get('screen');
            if (jump && FLOW.includes(jump)) STATE.screen = jump;
            renderAll();
        });
    </script>
</body>
</html>
